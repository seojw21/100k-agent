name: 100k Agent Daily Scan

on:
  schedule:
    # 한국 시간(KST) 오전 8시(23:00 UTC)와 오후 10시(13:00 UTC)에 실행
    - cron: '0 13,23 * * *'
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js 24 경고 해결
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 100k Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u src/core/agent.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add memory/*.md knowledge/ || true
          git commit -m "Auto-update: Agent Report + Knowledge $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin main
