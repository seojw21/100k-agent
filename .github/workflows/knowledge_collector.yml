name: Knowledge Auto Collector

# DISABLED schedule (2026-07-10) — 자동 커밋 루프 방지. 수동만.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests chromadb sentence-transformers

      - name: Step 1 - Reddit 자동 수집
        run: python -u src/core/reddit_collector.py

      - name: Step 2 - Gemini 분석 + 지식 DB 업데이트
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u src/core/knowledge_updater.py

      - name: Step 3 - Commit knowledge updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add knowledge/
          git commit -m "🧠 Auto knowledge update: $(date +'%Y-%m-%d %H:%M')" || echo "No new knowledge to commit"
          git pull --rebase origin main
          git push origin main
