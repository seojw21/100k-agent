name: Knowledge Auto Collector

on:
  schedule:
    # 매일 KST 오전 7시 (UTC 22:00) 실행 - agent.py보다 1시간 먼저
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests chromadb sentence-transformers

      - name: Step 1 - Reddit 자동 수집
        run: python -u reddit_collector.py

      - name: Step 2 - Gemini 분석 + 지식 DB 업데이트
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u knowledge_updater.py

      - name: Step 3 - Commit knowledge updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add knowledge/
          git commit -m "🧠 Auto knowledge update: $(date +'%Y-%m-%d %H:%M')" || echo "No new knowledge to commit"
          git push origin main
